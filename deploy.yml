- name: Deploy LeagueFit to GCP VM
  hosts: leaguefit
  become: true

  vars:
    app_dir: /home/ubuntu/leaguefit
    dockerhub_user: zanzadshubham25

  tasks:
    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure deployment directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Ensure logs directory exists
      file:
        path: "{{ app_dir }}/logs"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy production docker-compose file
      copy:
        src: docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Pull latest dataset image
      community.general.docker_image:
        name: "{{ dockerhub_user }}/dataset:latest"
        source: pull
        force_source: true

    - name: Pull latest backend image
      community.general.docker_image:
        name: "{{ dockerhub_user }}/backend:latest"
        source: pull
        force_source: true

    - name: Pull latest frontend image
      community.general.docker_image:
        name: "{{ dockerhub_user }}/frontend:latest"
        source: pull
        force_source: true

    - name: Restart all services with latest images
      shell: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Configure nginx reverse proxy for Streamlit
      copy:
        dest: /etc/nginx/sites-available/leaguefit
        content: |
          server {
              listen 80;
              location / {
                  proxy_pass http://localhost:8501;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
              }
          }

    - name: Enable leaguefit nginx site
      file:
        src: /etc/nginx/sites-available/leaguefit
        dest: /etc/nginx/sites-enabled/leaguefit
        state: link

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        enabled: true
