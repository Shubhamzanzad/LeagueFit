- name: Deploy LeagueFit to GCP VM
  hosts: leaguefit
  become: true

  vars:
    app_dir: /home/ubuntu/leaguefit
    dockerhub_user: zanzadshubham25

  tasks:
    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure deployment directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Ensure logs directory exists
      file:
        path: "{{ app_dir }}/logs"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy production docker-compose file
      copy:
        src: docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Pull latest dataset image
      community.general.docker_image:
        name: "{{ dockerhub_user }}/dataset:latest"
        source: pull
        force_source: true

    - name: Pull latest backend image
      community.general.docker_image:
        name: "{{ dockerhub_user }}/backend:latest"
        source: pull
        force_source: true

    - name: Pull latest frontend image
      community.general.docker_image:
        name: "{{ dockerhub_user }}/frontend:latest"
        source: pull
        force_source: true

    - name: Restart all services with latest images
      shell: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
